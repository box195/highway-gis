<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>고속도로 길찾기 UI 테스트 · 모의 GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{background:#0f172a;color:white;font:16px system-ui;padding:12px}button{padding:12px}#map{height:70vh;margin-top:12px}</style>
<h1>고속도로 길찾기 UI 테스트 · 모의 GPS</h1>
<p>사용자의 실제 위치를 요청하지 않습니다. 공개 도로 위의 고정 테스트 위치를 사용하며 네이버 앱 실행도 차단합니다.</p>
<button id="btn-highway-navigation">고속도로 길찾기 테스트</button><div id="map"></div>
<script type="module">
  import {TOLL_GATES} from '../data/highway-tollgates.mjs';
  const map=L.map('map').setView([37.4,127.15],10);
  const params=new URLSearchParams(location.search),tollgate=params.get('case')==='tollgate';
  const office=(name,id)=>{const p=TOLL_GATES.find(g=>g.id===id);return {name,lat:p.lat+.0007,lng:p.lng-.0015};};
  const suwon=office('수원신갈영업소',1814821448);
  const offices=tollgate?[office('곤지암영업소',436295655),office('서이천영업소',436294773),suwon]:[{name:'공개 도로 테스트 도착점 A',lat:37.43,lng:127.15},{name:'공개 도로 테스트 도착점 B',lat:37.5,lng:127.21}];
  window.HighwayApp={map,data:{offices},selected:{type:'office',item:offices[0]}};
  const mode=params.get('gps'),stationary=mode==='no-heading'||tollgate;
  Object.defineProperty(navigator,'geolocation',{value:{getCurrentPosition(success,error){queueMicrotask(()=>mode==='denied'?error({code:1}):success({coords:{latitude:tollgate?suwon.lat:37.30,longitude:tollgate?suwon.lng:127.10,accuracy:5,speed:stationary?0:10,heading:stationary?null:0}}));}}});
  document.addEventListener('click',event=>{if(event.target.closest('#hn-launch')){event.preventDefault();document.title='네이버 경유지 링크 생성 확인 · 모의 테스트';}});
</script>
<script type="module" src="../data/highway-navigation.mjs"></script></html>
